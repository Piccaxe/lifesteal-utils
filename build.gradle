plugins {
	id 'fabric-loom' version '1.17.12'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// Copies the built jar into each Modrinth profile below after every build. Missing folders are skipped
// (e.g. CI). If the game has the old jar loaded, Windows locks it and the delete fails — then that
// profile is left alone (overwriting a loaded jar crashes the game) and the in-mod GitHub
// auto-updater swaps it safely on exit instead.
def profileMods = ["NEW LSN", "Fabric 1.21.11"].collect {
	file("${System.getenv('APPDATA')}/ModrinthApp/profiles/${it}/mods")
}
tasks.register("deployToProfile") {
	dependsOn remapJar
	doLast {
		def built = remapJar.archiveFile.get().asFile
		profileMods.findAll { it.isDirectory() }.each { dir ->
			def target = new File(dir, built.name)
			def old = dir.listFiles().findAll {
				it.name.startsWith("piccaxes-lifesteal-utils-") && it.name.endsWith(".jar") && it.name != built.name
			}
			if (target.exists() && !target.delete()) {
				logger.warn("deployToProfile: ${target.name} in use in ${dir.parentFile.name} (game running) — skipped; restart to pick up the update.")
				return
			}
			def locked = old.findAll { !it.delete() }
			if (!locked.isEmpty()) {
				logger.warn("deployToProfile: ${locked*.name} in use in ${dir.parentFile.name} (game running) — skipped; restart to pick up the update.")
				return
			}
			java.nio.file.Files.copy(built.toPath(), target.toPath())
			logger.lifecycle("deployToProfile: installed ${built.name} into ${dir.parentFile.name}")
		}
	}
}
build.finalizedBy deployToProfile
